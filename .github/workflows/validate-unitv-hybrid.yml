name: UniTV Hybrid - Android integration
on:
  push:
    paths:
      - 'projetos/unitv-hybrid/**'
      - '.github/workflows/validate-unitv-hybrid.yml'
  pull_request:
    paths:
      - 'projetos/unitv-hybrid/**'
      - '.github/workflows/validate-unitv-hybrid.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projetos/unitv-hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :integration:testDebugUnitTest :integration:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: unitv-integration-aar
          path: projetos/unitv-hybrid/integration/build/outputs/aar/*.aar
          retention-days: 7
