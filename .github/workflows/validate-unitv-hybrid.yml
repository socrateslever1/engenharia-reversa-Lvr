name: UniTV Hybrid - Android integration
on:
  push:
    paths:
      - 'projetos/unitv-hybrid/**'
      - '.github/workflows/validate-unitv-hybrid.yml'
  pull_request:
    paths:
      - 'projetos/unitv-hybrid/**'
      - '.github/workflows/validate-unitv-hybrid.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projetos/unitv-hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 35 usando ferramentas do runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes do inventário estático
        run: python -m unittest discover -s tools/tests -v
      - name: Testes Android e AAR
        run: gradle --no-daemon :integration:testDebugUnitTest :integration:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: unitv-integration-aar
          path: projetos/unitv-hybrid/integration/build/outputs/aar/*.aar
          retention-days: 7
